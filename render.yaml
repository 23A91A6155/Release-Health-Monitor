services:
  # ==========================================
  # Backend — Node.js Express API
  # ==========================================
  - type: web
    name: release-health-monitor-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: SENTRY_DSN
        sync: false  # Set manually in Render dashboard
      - key: SENTRY_RELEASE
        value: release-health-monitor@1.0.0
      - key: SENTRY_ENVIRONMENT
        value: production

  # ==========================================
  # Frontend — React Vite Static Site
  # ==========================================
  - type: web
    name: release-health-monitor-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SENTRY_DSN
        sync: false  # Set manually in Render dashboard
      - key: VITE_SENTRY_RELEASE
        value: release-health-monitor@1.0.0
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_API_URL
        sync: false  # Set to your backend URL after first deploy
